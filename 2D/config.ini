# MPS Baseline 2D Configuration File
# 2D项目配置文件示例

[File]
# 输入目录
InputDir = data
# 输出目录
OutputDir = output
# 流体粒子文件
FluidParticleFile = fluid_particles_2d.txt
# 固体粒子文件
SolidParticleFile = solid_particles_2d.txt
# 结果文件
ResultFile = result_2d.txt

[Simulation]
# 时间步长 (s)
TimeStep = 0.001
# 总仿真时间 (s)
TotalTime = 1.0
# 最大迭代次数
MaxIterations = 1000
# 流体密度 (kg/m^3)
Density = 1000.0
# 动力学粘性系数 (m²/s)
KinematicViscosity = 0.001
# 重力加速度 X方向 (m/s^2)
GravityX = 0.0
# 重力加速度 Y方向 (m/s^2)
GravityY = -9.8
# 最小时间步 (s)
MinTimeStep = 1e-6
# 最大时间步 (s)
MaxTimeStep = 0.01
# 最大CFL数
MaxCFL = 0.5
# 输出文件间隔 (s)
OutputInterval = 0.1

[Particle]
# 粒子间距 (m)
ParticleSpacing = 0.02
# 粒子半径 (m)
ParticleRadius = 0.01
# 平滑半径 (m)，通常为2.1倍粒子间距
SmoothingRadius = 0.042
# 网格单元大小 (m)，通常为2倍平滑半径
CellSize = 0.084
