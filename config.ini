# MPS Baseline Configuration File
# 配置文件示例

[File]
# 输入目录
InputDir = data
# 输出目录
OutputDir = output
# 流体粒子文件
FluidParticleFile = fluid_particles.txt
# 固体粒子文件
SolidParticleFile = solid_particles.txt
# 结果文件
ResultFile = result.txt

[Simulation]
# 时间步长
TimeStep = 0.001
# 总仿真时间
TotalTime = 1.0
# 最大迭代次数
MaxIterations = 1000
# 流体密度 (kg/m^3)
Density = 1000.0
# 动力粘度 (Pa·s)
Viscosity = 0.001
# 重力加速度 X方向 (m/s^2)
GravityX = 0.0
# 重力加速度 Y方向 (m/s^2)
GravityY = 0.0
# 重力加速度 Z方向 (m/s^2)
GravityZ = -9.8

[Particle]
# 粒子半径 (m)
ParticleRadius = 0.01
# 平滑半径 (m)
SmoothingRadius = 0.02
# 粒子数量
ParticleCount = 1000

